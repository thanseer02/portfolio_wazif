<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#111214"/>
  <!-- Hard border to match tile -->
  <rect x="5" y="5" width="90" height="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Accent corner bracket -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#C4661F" stroke-width="4"/>
  
  <!-- Monospace 'W' -->
  <text x="50" y="65" font-family="'JetBrains Mono', monospace, sans-serif" font-size="48" font-weight="bold" fill="#F5F3EE" text-anchor="middle">W</text>
  
  <!-- Tiny coordinate -->
  <text x="12" y="90" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" fill="#A0A5AF">W.01</text>
</svg>
